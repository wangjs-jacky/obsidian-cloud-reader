<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的知识库</title>
    <link rel="stylesheet" href="/reader.css" />
    <script type="module" src="/reader.js"></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand">随身笔记<span>我的知识库</span></a>
      <nav aria-label="顶部导航">
        <div id="top-search"><button id="search-toggle" aria-label="展开搜索笔记" aria-expanded="false" aria-controls="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>搜索</span><kbd>⌘ K</kbd></button><div id="search-field" inert><input id="search" type="search" aria-label="搜索笔记" placeholder="搜索标题或路径" autocomplete="off"/><button id="search-close" aria-label="收起搜索">×</button></div></div>
        <button id="theme" aria-label="切换深浅主题">◐ 主题</button
        ><button id="settings" hidden>绑定 OSS</button><a id="login" class="account-link" href="/auth/login">登录 / 注册</a><span id="account-name" hidden></span>
        <form id="logout" hidden method="post" action="/auth/logout"><button>退出登录</button></form>
      </nav>
    </header>
    <div class="layout">
      <aside id="library-sidebar" aria-label="文件目录侧栏">
        <div class="side-heading"><strong>文件目录</strong><button id="toggle-library" class="panel-toggle" aria-label="收起文件目录" aria-expanded="true" title="收起文件目录">◧</button></div>
        <div class="side-content">
        <div class="tree-toolbar">
          <span id="view-label">文件目录</span><button id="clear-search" hidden>返回目录</button
          ><button id="locate" disabled>定位当前笔记</button>
        </div>
        <nav id="tree" aria-label="笔记目录"></nav>
        <ul id="notes" hidden aria-label="搜索结果"></ul>
        <div class="pager" id="search-pager" hidden>
          <button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button>
        </div>
        <details>
          <summary>同步与缓存</summary>
        <div class="catalog-info">
          <span id="count">尚未绑定知识库</span><button id="refresh" disabled>检查更新</button>
        </div>
        <p id="sync" role="status" class="muted"></p>
        <section id="load-progress" hidden aria-live="polite">
          <div class="progress-caption">
            <span id="progress-label"></span><span id="progress-value"></span>
          </div>
          <progress id="sync-progress" max="100" aria-label="目录更新进度"></progress>
          <p id="progress-detail"></p>
        </section>

          <p id="cache"></p>
        </details>
        </div>
      </aside>
      <main id="main">
        <div class="welcome">
          <small>你的私人阅读空间</small>
          <h2>让知识随手可读。</h2>
          <p>登录网站账号，再绑定自己的 OSS，即可随处阅读笔记。</p>
          <p class="muted">内容按需加载，已读内容会复用云端缓存。</p>
        </div>
      </main>
      <aside id="outline" hidden aria-label="文章大纲"><div class="side-heading"><strong>文章大纲</strong><button id="toggle-outline" class="panel-toggle" aria-label="收起文章大纲" aria-expanded="true" title="收起文章大纲">◨</button></div><details open><summary>展开文章大纲</summary><nav aria-label="文章标题"></nav></details></aside>
    </div>
    <dialog id="config">
      <form id="config-form">
        <h2>连接 OSS</h2>
        <p>填入 Remotely Save 使用的连接信息。支持未加密的 Markdown 仓库，只读取文件。</p>
        <label
          >Endpoint<input
            name="endpoint"
            placeholder="oss-cn-shanghai.aliyuncs.com"
            required /></label
        ><label>Bucket<input name="bucket" required /></label
        ><label>Region<input name="region" placeholder="cn-shanghai" required /></label
        ><label>目录前缀（可留空）<input name="prefix" /></label
        ><label for="accessKeyId">Access Key ID</label><div class="secret-input"><input id="accessKeyId" name="accessKeyId" type="password" autocomplete="new-password" required /><button type="button" class="key-eye" data-key="accessKeyId" aria-label="显示 Access Key ID" title="显示 Access Key ID" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div>
<label for="secretAccessKey">Access Key Secret</label><div class="secret-input"><input id="secretAccessKey" name="secretAccessKey" type="password" autocomplete="new-password" required /><button type="button" class="key-eye" data-key="secretAccessKey" aria-label="显示 Access Key Secret" title="显示 Access Key Secret" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div>
        <p class="muted">点击输入框右侧的小眼睛可显示或隐藏密钥。已保存的密钥留空表示保留；更换连接会清空旧缓存。</p>
        <p id="config-status" role="status"></p>
        <div class="actions">
          <button type="button" id="cancel">取消</button><button type="submit">验证并保存</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
